steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/delicias-frontend:$COMMIT_SHA', '.']
  
  # 2. Push the image to the registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/delicias-frontend:$COMMIT_SHA']
  
  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'delicias-da-lu-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/delicias-frontend:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'

# THIS IS THE FIX FOR YOUR ERROR
options:
  logging: CLOUD_LOGGING_ONLY